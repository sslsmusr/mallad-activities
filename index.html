<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mallard Madness</title>
    <link rel="stylesheet" href="style.css?v=56">
</head>

<body>
    <div id="game-container">
        <!-- Start Screen Overlay -->
        <div id="start-screen">
            <h1 class="game-title">MALLARD MADNESS</h1>
            <p class="game-subtitle">a game about nothing in particular</p>
            <button id="start-btn" class="btn">NEW GAME</button>
            <button id="start-btn-fs" class="btn" style="margin-top: 20px;">NEW GAME (FULLSCREEN)</button>
        </div>

        <!-- Character Selection Screen -->
        <div id="char-selection" style="display: none;">
            <h2 class="char-title">SELECT YOUR HUNTER</h2>
            <div class="char-container">
                <div class="char-card" id="char-1" onclick="selectCharacter(1)">
                    <div class="char-p-box" id="p-1"></div>
                    <p class="char-desc">The Urban Stalker: Master of the hunt. Starts with 8 shells.</p>
                </div>
                <div class="char-card" id="char-2" onclick="selectCharacter(2)">
                    <div class="char-p-box" id="p-2"></div>
                    <p class="char-desc">The Ascetic: Divine protection. Starts with 6 lives.</p>
                </div>
                <div class="char-card" id="char-3" onclick="selectCharacter(3)">
                    <div class="char-p-box" id="p-3"></div>
                    <p class="char-desc">The Arbitrator: Law & Order. 20% bonus points.</p>
                </div>
            </div>
        </div>

        <!-- Shadowy Figure Screen -->
        <div id="shadowy-screen" style="display: none;">
            <div id="shadowy-content">
                <div id="shadowy-portrait-container">
                    <canvas id="shadowy-char-canvas" width="120" height="120"></canvas>
                </div>
                <div id="shadowy-main">
                    <canvas id="shadowy-monk-canvas" width="300" height="400"></canvas>
                    <div id="shadowy-bubble">
                        <p id="shadowy-text"></p>
                    </div>
                    <button id="shadowy-continue" style="display: none;">Continue</button>
                </div>
            </div>
        </div>

        <!-- Vending Machine Screen -->
        <div id="vending-screen" style="display: none;">
            <div id="vending-machine">
                <h2 id="vending-title">Supplies available</h2>
                <div id="vending-options">
                    <button id="buy-life" class="vending-btn">
                        <div class="vending-icon heart-icon"></div>
                        <span class="vending-text">Life (+1)<br><small>20,000 pts</small></span>
                    </button>
                    <button id="buy-blessing" class="vending-btn">
                        <div class="vending-icon star-icon"></div>
                        <span class="vending-text">Blessing (3 rds)<br><small>30,000 pts</small></span>
                    </button>
                    <button id="buy-skip" class="vending-btn">
                        <div class="vending-icon wings-icon"></div>
                        <span class="vending-text">Skip (+10R)<br><small>50,000 pts</small></span>
                    </button>
                </div>
                <button id="vending-continue" class="btn">CONTINUE</button>
            </div>
        </div>

        <!-- The UI Layer (score, ammo, etc.) -->
        <div id="ui-layer">
            <div id="lives-display"></div>
            <div id="ammo-display">
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
            </div>
            <div id="score-display">000000</div>
            <div id="round-display">R=1</div>
        </div>

        <!-- Fullscreen toggle (floating top right) -->
        <button id="toggle-fs">⛶</button>

        <!-- Game Over Reset Button -->
        <button id="reset-btn" class="btn"
            style="display: none; position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 100;">RESET
            GAME</button>

        <!-- The Game Canvas (background, ducks, foreground) -->
        <canvas id="game-canvas"></canvas>
    </div>

    <script type="module" src="game.js?v=56"></script>
</body>

</html>
