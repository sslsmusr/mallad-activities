<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mallard Madness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen Overlay -->
        <div id="start-screen">
            <h1 class="game-title">MALLARD MADNESS</h1>
            <button id="start-btn">NEW GAME</button>
        </div>
        
        <!-- The UI Layer (score, ammo, etc.) -->
        <div id="ui-layer">
            <div id="score-display">000000</div>
            <div id="ammo-display">
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
            </div>
            <div id="round-display">R=1</div>
        </div>
        
        <!-- The Game Canvas (background, ducks, foreground) -->
        <canvas id="game-canvas"></canvas>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
